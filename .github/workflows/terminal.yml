name: Generate Terminal

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do projeto
        run: npm install

      - name: Gerar o SVG do Terminal
        run: node dist/bin/github-stats-terminal.js ${{ github.repository_owner }} hacker
        env:
          GITHUB_TOKEN: ${{ secrets.GHT }}

      - name: Guardar o ficheiro no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github_stats.svg
          git commit -m "Update Hacker Terminal Stats" || exit 0
          git push
