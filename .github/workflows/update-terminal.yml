name: Terminal SVG

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fetch GitHub Stats
        run: |
          USER="${{ github.repository_owner }}"
          
          USER_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/users/$USER")
          
          REPOS=$(echo "$USER_DATA" | jq '.public_repos // 0')
          GISTS=$(echo "$USER_DATA" | jq '.public_gists // 0')
          FOLLOWERS=$(echo "$USER_DATA" | jq '.followers // 0')
          
          STARS_DATA=$(curl -s "https://api.github.com/users/$USER/starred")
          if echo "$STARS_DATA" | jq -e '. | text' >/dev/null 2>&1; then
            STARS=0
          else
            STARS=$(echo "$STARS_DATA" | jq '. | length // 0')
          fi

          CREATED_AT=$(echo "$USER_DATA" | jq -r '.created_at')
          if [ "$CREATED_AT" != "null" ] && [ ! -z "$CREATED_AT" ]; then
            UPTIME=$(date -d "${CREATED_AT}" +%s 2>/dev/null || date -u -d "${CREATED_AT}" +%s 2>/dev/null)
            NOW=$(date +%s)
            DIFF=$(( (NOW - UPTIME) / 86400 ))
            YEARS=$(( DIFF / 365 ))
            DAYS=$(( DIFF % 365 ))
            UPTIME_STR="$YEARS years, $DAYS days"
          else
            UPTIME_STR="unknown uptime"
          fi

          # Calcula matematicamente o eixo X onde a digitação deve começar
          USER_LEN=${#USER}
          PROMPT_X=$(awk "BEGIN {print 30 + ($USER_LEN + 17) * 8.42}")

          echo "REPOS=$REPOS" >> $GITHUB_ENV
          echo "GISTS=$GISTS" >> $GITHUB_ENV
          echo "FOLLOWERS=$FOLLOWERS" >> $GITHUB_ENV
          echo "STARS=$STARS" >> $GITHUB_ENV
          echo "UPTIME_STR=$UPTIME_STR" >> $GITHUB_ENV
          echo "PROMPT_X=$PROMPT_X" >> $GITHUB_ENV

      - name: Generate SVG
        run: |
          cat << 'EOF' > terminal.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
            <style>
              .bg { fill: #0d1117; rx: 8px; }
              .bar { fill: #161b22; }
              .dot { r: 6px; cy: 18px; }
              .dot-red { fill: #ff5f56; cx: 25px; }
              .dot-yellow { fill: #ffbd2e; cx: 45px; }
              .dot-green { fill: #27c93f; cx: 65px; }
              
              .text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 14px; fill: #00ff00; }
              .prompt { font-weight: bold; }
              .command { fill: #ffffff; }
              .logo { fill: #00ff00; }
            </style>

            <rect width="800" height="500" class="bg" />
            <path d="M0,35 L800,35 L800,8 C800,3.5 796.5,0 792,0 L8,0 C3.5,0 0,3.5 0,8 Z" class="bar" />
            <circle class="dot dot-red" />
            <circle class="dot dot-yellow" />
            <circle class="dot dot-green" />

            <g class="text">
              <text x="30" y="90" class="prompt">${{ github.repository_owner }}@github.com :~$ </text>
              <svg x="${{ env.PROMPT_X }}" y="75" width="0" height="20">
                <animate attributeName="width" from="0" to="60" dur="0.4s" begin="0.2s" fill="freeze" />
                <text x="0" y="15" class="command">whoami</text>
              </svg>
              <text x="30" y="115" opacity="0">
                <animate attributeName="opacity" to="1" dur="0.1s" begin="0.7s" fill="freeze" />
                ${{ github.repository_owner }}
              </text>

              <text x="30" y="150" class="prompt" opacity="0">
                <animate attributeName="opacity" to="1" dur="0.1s" begin="1.2s" fill="freeze" />
                ${{ github.repository_owner }}@github.com :~$ 
              </text>
              <svg x="${{ env.PROMPT_X }}" y="135" width="0" height="20">
                <animate attributeName="width" from="0" to="75" dur="0.5s" begin="1.3s" fill="freeze" />
                <text x="0" y="15" class="command">neofetch</text>
              </svg>

              <g opacity="0">
                <animate attributeName="opacity" to="1" dur="0.1s" begin="2.0s" fill="freeze" />
                
                <g transform="translate(30, 170)" class="logo">
                  <rect x="60" y="0" width="80" height="15" />
                  <rect x="40" y="18" width="120" height="15" />
                  <rect x="20" y="36" width="30" height="15" /> <rect x="70" y="36" width="60" height="15" /> <rect x="150" y="36" width="30" height="15" />
                  <rect x="10" y="54" width="30" height="15" /> <rect x="160" y="54" width="30" height="15" />
                  <rect x="10" y="72" width="30" height="15" /> <rect x="160" y="72" width="30" height="15" />
                  <rect x="10" y="90" width="30" height="15" /> <rect x="160" y="90" width="30" height="15" />
                  <rect x="10" y="108" width="30" height="15" /> <rect x="160" y="108" width="30" height="15" />
                  <rect x="10" y="126" width="40" height="15" /> <rect x="150" y="126" width="40" height="15" />
                  <rect x="20" y="144" width="30" height="15" /> <rect x="70" y="144" width="40" height="15" /> <rect x="150" y="144" width="30" height="15" />
                </g>

                <g transform="translate(280, 180)">
                  <text x="0" y="0" font-weight="bold">${{ github.repository_owner }} @github.com</text>
                  <text x="0" y="15">---------------------</text>
                  <text x="0" y="40"><tspan font-weight="bold">OS: </tspan><tspan fill="#fff">GitHub Hacker OS</tspan></text>
                  <text x="0" y="60"><tspan font-weight="bold">Repos: </tspan><tspan fill="#fff">${{ env.REPOS }}</tspan></text>
                  <text x="0" y="80"><tspan font-weight="bold">Gists: </tspan><tspan fill="#fff">${{ env.GISTS }}</tspan></text>
                  <text x="0" y="100"><tspan font-weight="bold">Stars: </tspan><tspan fill="#fff">${{ env.STARS }}</tspan></text>
                  <text x="0" y="120"><tspan font-weight="bold">Followers: </tspan><tspan fill="#fff">${{ env.FOLLOWERS }}</tspan></text>
                </g>
              </g>

              <text x="30" y="340" class="prompt" opacity="0">
                <animate attributeName="opacity" to="1" dur="0.1s" begin="3.0s" fill="freeze" />
                ${{ github.repository_owner }}@github.com :~$ 
              </text>
              <svg x="${{ env.PROMPT_X }}" y="325" width="0" height="20">
                <animate attributeName="width" from="0" to="60" dur="0.4s" begin="3.1s" fill="freeze" />
                <text x="0" y="15" class="command">uptime</text>
              </svg>
              <text x="30" y="365" fill="#fff" opacity="0">
                <animate attributeName="opacity" to="1" dur="0.1s" begin="3.6s" fill="freeze" />
                ${{ env.UPTIME_STR }}
              </text>

              <text x="30" y="400" class="prompt" opacity="0">
                <animate attributeName="opacity" to="1" dur="0.1s" begin="4.2s" fill="freeze" />
                ${{ github.repository_owner }}@github.com :~$ 
              </text>
              <svg x="${{ env.PROMPT_X }}" y="385" width="0" height="20">
                <animate attributeName="width" from="0" to="40" dur="0.3s" begin="4.3s" fill="freeze" />
                <text x="0" y="15" class="command">exit</text>
              </svg>
              <text x="30" y="425" fill="#fff" opacity="0">
                <animate attributeName="opacity" to="1" dur="0.1s" begin="4.8s" fill="freeze" />
                logout
              </text>
            </g>

            <rect x="30" y="445" width="10" height="18" fill="#00ff00" opacity="0">
              <animate attributeName="opacity" values="1;0;1" dur="1s" begin="5.0s" repeatCount="indefinite" />
            </rect>
          </svg>
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add terminal.svg
          git commit -m "update stats" || exit 0
          git push
