name: Terminal SVG

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fetch GitHub Stats
        run: |
          USER="${{ github.repository_owner }}"
          
          REPOS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/users/$USER" | jq '.public_repos')
          GISTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/users/$USER" | jq '.public_gists')
          FOLLOWERS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/users/$USER" | jq '.followers')
          STARS=$(curl -s "https://api.github.com/users/$USER/starred" | jq '. | length')

          CREATED_AT=$(curl -s "https://api.github.com/users/$USER" | jq -r '.created_at')
          UPTIME=$(date -d "$CREATED_AT" +%s)
          NOW=$(date +%s)
          DIFF=$(( (NOW - UPTIME) / 86400 ))
          YEARS=$(( DIFF / 365 ))
          DAYS=$(( DIFF % 365 ))

          echo "REPOS=$REPOS" >> $GITHUB_ENV
          echo "GISTS=$GISTS" >> $GITHUB_ENV
          echo "FOLLOWERS=$FOLLOWERS" >> $GITHUB_ENV
          echo "STARS=$STARS" >> $GITHUB_ENV
          echo "UPTIME_STR=$YEARS years, $DAYS days" >> $GITHUB_ENV

      - name: Generate SVG
        run: |
          cat << 'EOF' > terminal.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
            <style>
              .bg { fill: #0d1117; rx: 8px; }
              .bar { fill: #161b22; }
              .dot { r: 6px; cy: 18px; }
              .dot-red { fill: #ff5f56; cx: 25px; }
              .dot-yellow { fill: #ffbd2e; cx: 45px; }
              .dot-green { fill: #27c93f; cx: 65px; }
              
              .text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 14px; fill: #00ff00; }
              .prompt { font-weight: bold; }
              .command { fill: #ffffff; }
              
              .fade-in {
                opacity: 0;
                animation: fadeIn 0.5s ease-in forwards;
                animation-delay: 2.5s;
              }

              @keyframes fadeIn {
                to { opacity: 1; }
              }
              
              .logo { fill: #00ff00; }
            </style>

            <rect width="800" height="500" class="bg" />
            <path d="M0,35 L800,35 L800,8 C800,3.5 796.5,0 792,0 L8,0 C3.5,0 0,3.5 0,8 Z" class="bar" />
            <circle class="dot dot-red" />
            <circle class="dot dot-yellow" />
            <circle class="dot dot-green" />

            <g transform="translate(30, 70)" class="text">
              <text x="0" y="0">
                <tspan class="prompt">${{ github.repository_owner }}@github.com :~$ </tspan>
                <tspan class="command">whoami</tspan>
              </text>
              
              <text x="0" y="25" class="fade-in">${{ github.repository_owner }}</text>

              <g class="fade-in" style="animation-delay: 1.5s;">
                <text x="0" y="60">
                  <tspan class="prompt">${{ github.repository_owner }}@github.com :~$ </tspan>
                  <tspan class="command">neofetch</tspan>
                </text>
              </g>

              <g class="fade-in" style="animation-delay: 2s;">
                <g transform="translate(0, 80)" class="logo">
                  <rect x="60" y="0" width="80" height="15" />
                  <rect x="40" y="18" width="120" height="15" />
                  <rect x="20" y="36" width="30" height="15" /> <rect x="70" y="36" width="60" height="15" /> <rect x="150" y="36" width="30" height="15" />
                  <rect x="10" y="54" width="30" height="15" /> <rect x="160" y="54" width="30" height="15" />
                  <rect x="10" y="72" width="30" height="15" /> <rect x="160" y="72" width="30" height="15" />
                  <rect x="10" y="90" width="30" height="15" /> <rect x="160" y="90" width="30" height="15" />
                  <rect x="10" y="108" width="30" height="15" /> <rect x="160" y="108" width="30" height="15" />
                  <rect x="10" y="126" width="40" height="15" /> <rect x="150" y="126" width="40" height="15" />
                  <rect x="20" y="144" width="30" height="15" /> <rect x="70" y="144" width="40" height="15" /> <rect x="150" y="144" width="30" height="15" />
                </g>

                <g transform="translate(250, 90)">
                  <text x="0" y="0" font-weight="bold">${{ github.repository_owner }} @github.com</text>
                  <text x="0" y="15">---------------------</text>
                  <text x="0" y="40"><tspan font-weight="bold">OS: </tspan><tspan fill="#fff">GitHub Hacker OS</tspan></text>
                  <text x="0" y="60"><tspan font-weight="bold">Repos: </tspan><tspan fill="#fff">${{ env.REPOS }}</tspan></text>
                  <text x="0" y="80"><tspan font-weight="bold">Gists: </tspan><tspan fill="#fff">${{ env.GISTS }}</tspan></text>
                  <text x="0" y="100"><tspan font-weight="bold">Stars: </tspan><tspan fill="#fff">${{ env.STARS }}</tspan></text>
                  <text x="0" y="120"><tspan font-weight="bold">Followers: </tspan><tspan fill="#fff">${{ env.FOLLOWERS }}</tspan></text>
                </g>
              </g>

              <g class="fade-in" style="animation-delay: 3.5s;">
                <text x="0" y="310">
                  <tspan class="prompt">${{ github.repository_owner }}@github.com :~$ </tspan>
                  <tspan class="command">uptime</tspan>
                </text>
                <text x="0" y="335" fill="#fff">${{ env.UPTIME_STR }}</text>

                <text x="0" y="370">
                  <tspan class="prompt">${{ github.repository_owner }}@github.com :~$ </tspan>
                  <tspan class="command">exit</tspan>
                </text>
              </g>
            </g>
            
            <rect x="70" y="432" width="10" height="18" fill="#00ff00" class="fade-in" style="animation-delay: 4s;">
              <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
            </rect>
          </svg>
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add terminal.svg
          git commit -m "update stats" || exit 0
          git push
