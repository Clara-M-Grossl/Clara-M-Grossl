name: Terminal SVG

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fetch GitHub Stats
        run: |
          USER="${{ github.repository_owner }}"
          
          # Requisição segura com o GITHUB_TOKEN nativo
          USER_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/users/$USER")
          
          REPOS=$(echo "$USER_DATA" | jq '.public_repos // 0')
          GISTS=$(echo "$USER_DATA" | jq '.public_gists // 0')
          FOLLOWERS=$(echo "$USER_DATA" | jq '.followers // 0')
          
          # Fallback seguro para estrelas se a API der rate-limit
          STARS_DATA=$(curl -s "https://api.github.com/users/$USER/starred")
          if echo "$STARS_DATA" | jq -e '. | text' >/dev/null 2>&1; then
            STARS=0
          else
            STARS=$(echo "$STARS_DATA" | jq '. | length // 0')
          fi

          # Parser de data robusto usando ISO 8601 (padrão da API do GitHub)
          CREATED_AT=$(echo "$USER_DATA" | jq -r '.created_at')
          if [ "$CREATED_AT" != "null" ] && [ ! -z "$CREATED_AT" ]; then
            UPTIME=$(date -d "${CREATED_AT}" +%s 2>/dev/null || date -u -d "${CREATED_AT}" +%s 2>/dev/null)
            NOW=$(date +%s)
            DIFF=$(( (NOW - UPTIME) / 86400 ))
            YEARS=$(( DIFF / 365 ))
            DAYS=$(( DIFF % 365 ))
            UPTIME_STR="$YEARS years, $DAYS days"
          else
            UPTIME_STR="unknown uptime"
          fi

          echo "REPOS=$REPOS" >> $GITHUB_ENV
          echo "GISTS=$GISTS" >> $GITHUB_ENV
          echo "FOLLOWERS=$FOLLOWERS" >> $GITHUB_ENV
          echo "STARS=$STARS" >> $GITHUB_ENV
          echo "UPTIME_STR=$UPTIME_STR" >> $GITHUB_ENV

      - name: Generate SVG
        run: |
          cat << 'EOF' > terminal.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
            <style>
              .bg { fill: #0d1117; rx: 8px; }
              .bar { fill: #161b22; }
              .dot { r: 6px; cy: 18px; }
              .dot-red { fill: #ff5f56; cx: 25px; }
              .dot-yellow { fill: #ffbd2e; cx: 45px; }
              .dot-green { fill: #27c93f; cx: 65px; }
              
              .text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 14px; fill: #00ff00; }
              .prompt { font-weight: bold; }
              .logo { fill: #00ff00; }

              .cmd { 
                fill: none; 
                stroke: #ffffff; 
                stroke-width: 2; 
                stroke-linecap: round; 
                stroke-dasharray: 100; 
                stroke-dashoffset: 100; 
                animation: typeCmd 0.4s steps(10) forwards;
              }

              .cmd-whoami   { animation-delay: 0.1s; }
              .cmd-neofetch { animation-delay: 0.8s; }
              .cmd-uptime   { animation-delay: 1.8s; }
              .cmd-exit     { animation-delay: 2.6s; }

              .out-whoami   { opacity: 0; animation: show 0.01s forwards; animation-delay: 0.6s; }
              .out-neofetch { opacity: 0; animation: show 0.01s forwards; animation-delay: 1.3s; }
              .out-uptime   { opacity: 0; animation: show 0.01s forwards; animation-delay: 2.3s; }
              .out-exit     { opacity: 0; animation: show 0.01s forwards; animation-delay: 3.1s; }

              @keyframes typeCmd {
                to { stroke-dashoffset: 0; fill: #ffffff; stroke: none; }
              }
              @keyframes show {
                to { opacity: 1; }
              }
            </style>

            <rect width="800" height="500" class="bg" />
            <path d="M0,35 L800,35 L800,8 C800,3.5 796.5,0 792,0 L8,0 C3.5,0 0,3.5 0,8 Z" class="bar" />
            <circle class="dot dot-red" />
            <circle class="dot dot-yellow" />
            <circle class="dot dot-green" />

            <g transform="translate(30, 70)" class="text">
              <text x="0" y="0">
                <tspan class="prompt">${{ github.repository_owner }}@github.com :~$ </tspan>
                <tspan class="cmd cmd-whoami">whoami</tspan>
              </text>
              <text x="0" y="25" class="out-whoami" fill="#00ff00">${{ github.repository_owner }}</text>

              <g>
                <text x="0" y="60">
                  <tspan class="prompt">${{ github.repository_owner }}@github.com :~$ </tspan>
                  <tspan class="cmd cmd-neofetch">neofetch</tspan>
                </text>
              </g>

              <g class="out-neofetch">
                <g transform="translate(0, 80)" class="logo">
                  <rect x="60" y="0" width="80" height="15" />
                  <rect x="40" y="18" width="120" height="15" />
                  <rect x="20" y="36" width="30" height="15" /> <rect x="70" y="36" width="60" height="15" /> <rect x="150" y="36" width="30" height="15" />
                  <rect x="10" y="54" width="30" height="15" /> <rect x="160" y="54" width="30" height="15" />
                  <rect x="10" y="72" width="30" height="15" /> <rect x="160" y="72" width="30" height="15" />
                  <rect x="10" y="90" width="30" height="15" /> <rect x="160" y="90" width="30" height="15" />
                  <rect x="10" y="108" width="30" height="15" /> <rect x="160" y="108" width="30" height="15" />
                  <rect x="10" y="126" width="40" height="15" /> <rect x="150" y="126" width="40" height="15" />
                  <rect x="20" y="144" width="30" height="15" /> <rect x="70" y="144" width="40" height="15" /> <rect x="150" y="144" width="30" height="15" />
                </g>

                <g transform="translate(250, 90)">
                  <text x="0" y="0" font-weight="bold">${{ github.repository_owner }} @github.com</text>
                  <text x="0" y="15">---------------------</text>
                  <text x="0" y="40"><tspan font-weight="bold">OS: </tspan><tspan fill="#fff">GitHub Hacker OS</tspan></text>
                  <text x="0" y="60"><tspan font-weight="bold">Repos: </tspan><tspan fill="#fff">${{ env.REPOS }}</tspan></text>
                  <text x="0" y="80"><tspan font-weight="bold">Gists: </tspan><tspan fill="#fff">${{ env.GISTS }}</tspan></text>
                  <text x="0" y="100"><tspan font-weight="bold">Stars: </tspan><tspan fill="#fff">${{ env.STARS }}</tspan></text>
                  <text x="0" y="120"><tspan font-weight="bold">Followers: </tspan><tspan fill="#fff">${{ env.FOLLOWERS }}</tspan></text>
                </g>
              </g>

              <g>
                <text x="0" y="310">
                  <tspan class="prompt">${{ github.repository_owner }}@github.com :~$ </tspan>
                  <tspan class="cmd cmd-uptime">uptime</tspan>
                </text>
                <text x="0" y="335" fill="#fff" class="out-uptime">${{ env.UPTIME_STR }}</text>

                <text x="0" y="370" class="out-uptime">
                  <tspan class="prompt">${{ github.repository_owner }}@github.com :~$ </tspan>
                  <tspan class="cmd cmd-exit">exit</tspan>
                </text>
                <text x="0" y="395" fill="#fff" class="out-exit">exit</text>
              </g>
            </g>

            <rect x="30" y="465" width="10" height="18" fill="#00ff00" class="out-exit">
              <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
            </rect>
          </svg>
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add terminal.svg
          git commit -m "update stats" || exit 0
          git push
